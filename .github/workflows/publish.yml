name: Publish convention plugins

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '*-plugin/**'
      - 'conventions-support/**'
      - 'samples/**'
      - 'catalogs/build-tools/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/publish.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '*-plugin/**'
      - 'conventions-support/**'
      - 'samples/**'
      - 'catalogs/build-tools/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_tools_changed: ${{ steps.changes.outputs.build_tools_changed }}
      initial_import: ${{ steps.changes.outputs.initial_import }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect publication changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-list --max-parents=0 HEAD)
          fi

          initial_import=false
          build_tools_changed=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
              && ! git cat-file -e "$base:catalogs/settings.gradle" 2>/dev/null; then
            initial_import=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] \
              || ! git diff --quiet "$base"...HEAD -- catalogs/build-tools; then
            build_tools_changed=true
          fi

          echo "build_tools_changed=$build_tools_changed" >> "$GITHUB_OUTPUT"
          echo "initial_import=$initial_import" >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test plugins
            task: build
          - name: Validate minimal sample
            task: checkMinimalSample
          - name: Validate datagen sample
            task: checkDatagenSample
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run validation
        run: ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

  publish:
    needs: [plan, validate]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.plan.outputs.initial_import != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Publish build tool catalog to KafMaven
        if: needs.plan.outputs.build_tools_changed == 'true'
        env:
          MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
        run: >-
          ./gradlew -p catalogs --no-daemon --stacktrace
          :build-tools:publishAllPublicationsToKafMavenRepository

      - name: Publish to KafMaven
        env:
          MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace publishAllPublicationsToKafMavenRepository
