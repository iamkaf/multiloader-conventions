name: Publish Maven artifacts

# Publishes the selected Minecraft versions of a mod repository to Kaf Maven.
# Callers grant id-token: write so each job can get a Kaf Maven publish token; see templates/publish.yml.
on:
  workflow_call:
    inputs:
      commit:
        description: Full commit SHA to publish. Empty uses the caller's ref.
        type: string
        default: ''
      versions:
        description: Comma-separated Minecraft versions from versions/<version>. Empty publishes all.
        type: string
        default: ''
      loaders:
        description: Comma-separated loaders to publish. Empty publishes every loader of each version.
        type: string
        default: ''
      common:
        description: Publish the Common artifact of each version.
        type: boolean
        default: true
      working-directory:
        description: Directory of the Gradle build, for repositories that keep it below the root.
        type: string
        default: .

permissions:
  contents: read
  # Each publish trades GitHub's OIDC token for a Kaf Maven publish token.
  id-token: write

jobs:
  select-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      versions: ${{ steps.set-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Select versions to publish
        id: set-versions
        shell: bash
        env:
          VERSIONS: ${{ inputs.versions }}
          LOADERS: ${{ inputs.loaders }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          [[ "$WORKDIR" =~ ^[A-Za-z0-9._/-]+$ && "$WORKDIR" != /* && "$WORKDIR" != *..* ]] || { echo "working-directory must stay inside the repository" >&2; exit 1; }
          [[ "$VERSIONS" =~ ^[A-Za-z0-9._,-]*$ ]] || { echo "versions has unexpected characters" >&2; exit 1; }
          [[ "$LOADERS" =~ ^[a-z,]*$ ]] || { echo "loaders has unexpected characters" >&2; exit 1; }

          if [ -n "$VERSIONS" ]; then
            IFS=',' read -ra selected <<< "$VERSIONS"
            for version in "${selected[@]}"; do
              [ -f "versions/$version/gradle.properties" ] || { echo "Unknown version: $version" >&2; exit 1; }
            done
            versions=$(printf '%s\n' "${selected[@]}")
          else
            versions=$(find versions -mindepth 2 -maxdepth 2 -type f -name gradle.properties -printf '%h\n' | xargs -r -n1 basename | sort -V)
          fi

          versions_json=$(printf '%s\n' "$versions" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "versions=$versions_json" >> "$GITHUB_OUTPUT"
          echo "Publishing versions: $versions_json"

  publish:
    needs: select-versions
    if: needs.select-versions.outputs.versions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      matrix:
        version: ${{ fromJson(needs.select-versions.outputs.versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Java version
        id: java
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          props="versions/$VERSION/gradle.properties"
          v=$(sed -nE 's/^project\.build-java=([0-9]+).*/\1/p' "$props" | head -n1)
          if [ -z "$v" ]; then
            v=$(sed -nE 's/^project\.java=([0-9]+).*/\1/p' "$props" | head -n1)
          fi
          if [ -z "$v" ]; then
            echo "project.build-java/project.java not found in $props" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Resolve snapshots fresh
        shell: bash
        working-directory: ${{ github.workspace }}
        # Snapshot dependencies (this plugin's 3.0-SNAPSHOT modules, the platform catalogs) are
        # checked against the repository on every build, so a restored cache never mixes an older
        # snapshot with a newer one. Fixed versions, Minecraft, and loader caches stay cached.
        # In init.d, so nested Gradle builds pick it up too.
        run: |
          set -euo pipefail
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          cat > "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/fresh-snapshots.init.gradle.kts" <<'EOF'
          beforeSettings {
              buildscript.configurations.configureEach { resolutionStrategy.cacheChangingModulesFor(0, "seconds") }
          }
          allprojects {
              buildscript.configurations.configureEach { resolutionStrategy.cacheChangingModulesFor(0, "seconds") }
              configurations.configureEach { resolutionStrategy.cacheChangingModulesFor(0, "seconds") }
          }
          EOF

      - name: Get a Kaf Maven publish token
        shell: bash
        # GitHub's OIDC token proves this run; z.kaf.sh trades it for a one-hour publish token.
        run: |
          set -euo pipefail
          oidc=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=maven.kaf.sh" | jq -r .value)
          token=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $oidc" https://z.kaf.sh/token | jq -r .token)
          echo "::add-mask::$token"
          echo "KAF_MAVEN_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Publish ${{ matrix.version }} to Kaf Maven
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          LOADERS: ${{ inputs.loaders }}
          COMMON: ${{ inputs.common }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          enabled=$(sed -nE 's/^project\.enabled-loaders=(.*)$/\1/p' "versions/$VERSION/gradle.properties" | head -n1 | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d')
          tasks=()
          [ "$COMMON" != true ] || tasks+=(":common:$VERSION:publishAllPublicationsToKafMavenRepository")
          for loader in $enabled; do
            if [ -z "$LOADERS" ] || [[ ",$LOADERS," == *",$loader,"* ]]; then
              tasks+=(":$loader:$VERSION:publishAllPublicationsToKafMavenRepository")
            fi
          done
          if [ ${#tasks[@]} -eq 0 ]; then
            echo "Nothing to publish for $VERSION" >&2
            exit 1
          fi
          ./gradlew --configure-on-demand "${tasks[@]}" --console=plain
