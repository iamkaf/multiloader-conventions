name: Check shared mod CI

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/plan-mod-build/**'
      - '.github/actions/run-teakit/**'
      - '.github/workflows/mod-build.yml'
      - '.github/workflows/check-mod-ci.yml'
  pull_request:
    paths:
      - '.github/actions/plan-mod-build/**'
      - '.github/actions/run-teakit/**'
      - '.github/workflows/mod-build.yml'
      - '.github/workflows/check-mod-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s .github/actions/plan-mod-build -v
      - run: python3 -m unittest discover -s .github/actions/run-teakit -v
