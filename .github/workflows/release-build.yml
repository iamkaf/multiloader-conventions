name: Release build

# Builds one commit of a mod repository and hands the result to the build host with
# the run's GitHub OIDC token. No repository or organization secrets are used.
on:
  workflow_call:
    inputs:
      kind:
        description: graph writes the build graph, release builds the selected jars and their manifest.
        type: string
        required: true
      commit:
        description: Full commit SHA to build.
        type: string
        required: true
      versions:
        description: Comma-separated Minecraft versions from versions/<version>. Empty selects all.
        type: string
        default: ''
      loaders:
        description: Comma-separated loaders. Empty selects all.
        type: string
        default: ''
      build-id:
        description: Identifier the build host knows this build by.
        type: string
        required: true
      working-directory:
        description: Directory of the Gradle build, for repositories that keep it below the root.
        type: string
        default: .

# The caller's release.yml must grant the same: a called workflow gets no more than its caller.
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ inputs.kind == 'graph' && 'Read build graph' || 'Build release jars' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      KIND: ${{ inputs.kind }}
      COMMIT: ${{ inputs.commit }}
      VERSIONS: ${{ inputs.versions }}
      LOADERS: ${{ inputs.loaders }}
      BUILD_ID: ${{ inputs.build-id }}
      WORKDIR: ${{ inputs.working-directory }}
      HANDOFF_URL: https://builds.iamkaf.workers.dev
    steps:
      - name: Validate inputs
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$KIND" == graph || "$KIND" == release ]] || { echo "kind must be graph or release" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a full SHA" >&2; exit 1; }
          [[ "$BUILD_ID" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo "build-id has unexpected characters" >&2; exit 1; }
          [[ "$VERSIONS" =~ ^[A-Za-z0-9._,-]*$ ]] || { echo "versions has unexpected characters" >&2; exit 1; }
          [[ "$LOADERS" =~ ^[a-z,]*$ ]] || { echo "loaders has unexpected characters" >&2; exit 1; }
          [[ "$WORKDIR" =~ ^[A-Za-z0-9._/-]+$ && "$WORKDIR" != /* && "$WORKDIR" != *..* ]] || { echo "working-directory must stay inside the repository" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Plan builds
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "$KIND" = graph ]; then
            echo "javas=25" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A server plugin has no versions/ folder: one jar builds from the root properties.
          if [ ! -d versions ]; then
            java=$(sed -nE 's/^project\.build-java=([0-9]+).*/\1/p' gradle.properties | head -n1)
            [ -n "$java" ] || java=$(sed -nE 's/^project\.java=([0-9]+).*/\1/p' gradle.properties | head -n1)
            [ -n "$java" ] || { echo "No Java version in gradle.properties" >&2; exit 1; }
            [ "$java" -ge 21 ] || java=21
            echo "$java -" > "$RUNNER_TEMP/batches"
            {
              echo "javas<<JAVAS"
              echo "$java"
              echo "JAVAS"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$VERSIONS" ]; then
            IFS=',' read -ra selected <<< "$VERSIONS"
          else
            mapfile -t selected < <(find versions -mindepth 2 -maxdepth 2 -name gradle.properties -printf '%h\n' | xargs -r -n1 basename | sort -V)
          fi

          # One line per batch, "java versions": versions of one Java level, at most three per Gradle run.
          : > "$RUNNER_TEMP/batches"
          declare -A by_java=()
          for version in "${selected[@]}"; do
            props="versions/$version/gradle.properties"
            [ -f "$props" ] || { echo "Unknown version: $version" >&2; exit 1; }
            java=$(sed -nE 's/^project\.build-java=([0-9]+).*/\1/p' "$props" | head -n1)
            [ -n "$java" ] || java=$(sed -nE 's/^project\.java=([0-9]+).*/\1/p' "$props" | head -n1)
            [ -n "$java" ] || { echo "No Java version in $props" >&2; exit 1; }
            [ "$java" -ge 21 ] || java=21
            by_java[$java]+="$version "
          done
          for java in "${!by_java[@]}"; do
            read -ra group <<< "${by_java[$java]}"
            for ((i = 0; i < ${#group[@]}; i += 3)); do
              echo "$java $(IFS=,; echo "${group[*]:i:3}")" >> "$RUNNER_TEMP/batches"
            done
          done
          [ -s "$RUNNER_TEMP/batches" ] || { echo "No Minecraft versions selected" >&2; exit 1; }

          {
            echo "javas<<JAVAS"
            cut -d' ' -f1 "$RUNNER_TEMP/batches" | sort -un
            echo "JAVAS"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ steps.plan.outputs.javas }}

      # Release builds on the default branch save the Gradle cache (Minecraft, loader toolchains,
      # dependencies) for the next one. Graph reads only restore it: their small cache must not
      # become the newest entry a release build restores.
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ inputs.kind == 'graph' || github.ref_name != github.event.repository.default_branch }}

      - name: Resolve snapshots fresh
        shell: bash
        working-directory: ${{ github.workspace }}
        # Snapshot dependencies (this plugin's 3.0-SNAPSHOT modules, the platform catalogs) are
        # checked against the repository on every build, so a restored cache never mixes an older
        # snapshot with a newer one. Fixed versions, Minecraft, and loader caches stay cached.
        # In init.d, so nested Gradle builds pick it up too.
        run: |
          set -euo pipefail
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          cat > "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/fresh-snapshots.init.gradle.kts" <<'EOF'
          beforeSettings {
              buildscript.configurations.configureEach { resolutionStrategy.cacheChangingModulesFor(0, "seconds") }
          }
          allprojects {
              buildscript.configurations.configureEach { resolutionStrategy.cacheChangingModulesFor(0, "seconds") }
              configurations.configureEach { resolutionStrategy.cacheChangingModulesFor(0, "seconds") }
          }
          EOF

      - name: Read build graph
        if: inputs.kind == 'graph'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          args=()
          [ -z "$VERSIONS" ] || args+=("-Pmultiloader.target.versions=$VERSIONS")
          [ -z "$LOADERS" ] || args+=("-Pmultiloader.target.loaders=$LOADERS")
          ./gradlew "${args[@]}" writeMultiloaderGraph --console=plain --max-workers=2
          test -s build/reports/multiloader/graph.json

      - name: Build release jars and manifest
        if: inputs.kind == 'release'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/manifests"
          n=0
          while read -r java versions; do
            n=$((n + 1))
            echo "::group::Minecraft $versions (Java $java)"
            home_var="JAVA_HOME_${java}_X64"
            args=()
            [ "$versions" = - ] || args+=("-Pmultiloader.target.versions=$versions")
            [ -z "$LOADERS" ] || args+=("-Pmultiloader.target.loaders=$LOADERS")
            JAVA_HOME="${!home_var}" ./gradlew "${args[@]}" writeReleaseManifest --console=plain --max-workers=2 < /dev/null
            cp build/release/release-manifest.json "$RUNNER_TEMP/manifests/$n.json"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/batches"

          # Batches share the repository header, so the files of every batch go into one manifest.
          jq -s '.[0] + {files: (map(.files) | add)}' "$RUNNER_TEMP"/manifests/*.json > "$RUNNER_TEMP/release-manifest.json"
          jq -e '(.files | length) > 0 and ([.files[].path] | length == (unique | length))' \
            "$RUNNER_TEMP/release-manifest.json" > /dev/null
          jq -e --arg commit "$COMMIT" '.commit == $commit' "$RUNNER_TEMP/release-manifest.json" > /dev/null
          # The jars to attest, exactly as the manifest lists them, in `shasum -a 256` format.
          jq -r '.files[] | "\(.sha256)  \(.path | split("/") | last)"' "$RUNNER_TEMP/release-manifest.json" > "$RUNNER_TEMP/subjects.txt"

      # GitHub's public proof that these jars came from this commit and workflow. Anyone can check
      # a downloaded jar with `gh attestation verify <jar> --repo <owner>/<repo>`. GitHub attests
      # private repositories only on Enterprise plans, so those skip it.
      - name: Attest release jars
        id: attest
        if: inputs.kind == 'release' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

      - name: Upload build result
        shell: bash
        env:
          # Empty when the attest step was skipped.
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          base="$HANDOFF_URL/v1/builds/$BUILD_ID"

          # Tokens are short-lived, so each request asks for a fresh one. The host accepts an
          # identical post twice, so a request that failed in transit is simply sent again.
          send() {
            local method="$1" url="$2" type="$3" file="$4" token status attempt
            for attempt in 1 2 3; do
              token=$(curl -sS --fail-with-body \
                -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=builds.kaf.sh" | jq -r .value) || token=
              status=000
              if [ -n "$token" ]; then
                status=$(curl -sS -o "$RUNNER_TEMP/response" -w '%{http_code}' -X "$method" \
                  -H "Authorization: Bearer $token" \
                  -H "Content-Type: $type" \
                  -H "Content-Length: $(stat -c %s "$file")" \
                  --data-binary "@$file" "$url") || status=000
              fi
              if [[ "$status" =~ ^2 ]]; then
                return 0
              fi
              if [[ "$status" =~ ^(000|408|429|5[0-9][0-9])$ ]] && [ "$attempt" -lt 3 ]; then
                echo "$method $url answered HTTP $status, trying again" >&2
                sleep $((attempt * 10))
                continue
              fi
              echo "$method $url failed with HTTP $status" >&2
              cat "$RUNNER_TEMP/response" >&2 || true
              exit 1
            done
          }

          if [ "$KIND" = graph ]; then
            send POST "$base/graph" application/json build/reports/multiloader/graph.json
            exit 0
          fi

          manifest="$RUNNER_TEMP/release-manifest.json"
          if [ -n "$ATTESTATION_URL" ]; then
            jq --arg url "$ATTESTATION_URL" '. + {attestation: $url}' "$manifest" > "$RUNNER_TEMP/attested.json"
            manifest="$RUNNER_TEMP/attested.json"
          fi
          send POST "$base/manifest" application/json "$manifest"
          while read -r path; do
            encoded=$(jq -rn --arg path "$path" '$path | @uri')
            send PUT "$base/files/$encoded" application/java-archive "build/publishing/artifacts/$path"
            echo "Uploaded $path"
          done < <(jq -r '.files[].path' "$manifest")
