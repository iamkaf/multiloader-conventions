name: Release build

# Builds one commit of a mod repository and hands the result to the build host with
# the run's GitHub OIDC token. No repository or organization secrets are used.
on:
  workflow_call:
    inputs:
      kind:
        description: graph writes the build graph, release builds the selected jars and their manifest.
        type: string
        required: true
      commit:
        description: Full commit SHA to build.
        type: string
        required: true
      versions:
        description: Comma-separated Minecraft versions from versions/<version>. Empty selects all.
        type: string
        default: ''
      loaders:
        description: Comma-separated loaders. Empty selects all.
        type: string
        default: ''
      build-id:
        description: Identifier the build host knows this build by.
        type: string
        required: true
      handoff-url:
        description: Base URL of the build host.
        type: string
        default: https://builds.kaf.sh

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: ${{ inputs.kind == 'graph' && 'Read build graph' || 'Build release jars' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KIND: ${{ inputs.kind }}
      COMMIT: ${{ inputs.commit }}
      VERSIONS: ${{ inputs.versions }}
      LOADERS: ${{ inputs.loaders }}
      BUILD_ID: ${{ inputs.build-id }}
      HANDOFF_URL: ${{ inputs.handoff-url }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$KIND" == graph || "$KIND" == release ]] || { echo "kind must be graph or release" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a full SHA" >&2; exit 1; }
          [[ "$BUILD_ID" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo "build-id has unexpected characters" >&2; exit 1; }
          [[ "$VERSIONS" =~ ^[A-Za-z0-9._,-]*$ ]] || { echo "versions has unexpected characters" >&2; exit 1; }
          [[ "$LOADERS" =~ ^[a-z,]*$ ]] || { echo "loaders has unexpected characters" >&2; exit 1; }
          [[ "$HANDOFF_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || { echo "handoff-url must be an https origin" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Plan builds
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "$KIND" = graph ]; then
            echo "javas=25" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$VERSIONS" ]; then
            IFS=',' read -ra selected <<< "$VERSIONS"
          else
            mapfile -t selected < <(find versions -mindepth 2 -maxdepth 2 -name gradle.properties -printf '%h\n' | xargs -r -n1 basename | sort -V)
          fi

          # One line per batch, "java versions": versions of one Java level, at most three per Gradle run.
          : > "$RUNNER_TEMP/batches"
          declare -A by_java=()
          for version in "${selected[@]}"; do
            props="versions/$version/gradle.properties"
            [ -f "$props" ] || { echo "Unknown version: $version" >&2; exit 1; }
            java=$(sed -nE 's/^project\.build-java=([0-9]+).*/\1/p' "$props" | head -n1)
            [ -n "$java" ] || java=$(sed -nE 's/^project\.java=([0-9]+).*/\1/p' "$props" | head -n1)
            [ -n "$java" ] || { echo "No Java version in $props" >&2; exit 1; }
            [ "$java" -ge 21 ] || java=21
            by_java[$java]+="$version "
          done
          for java in "${!by_java[@]}"; do
            read -ra group <<< "${by_java[$java]}"
            for ((i = 0; i < ${#group[@]}; i += 3)); do
              echo "$java $(IFS=,; echo "${group[*]:i:3}")" >> "$RUNNER_TEMP/batches"
            done
          done
          [ -s "$RUNNER_TEMP/batches" ] || { echo "No Minecraft versions selected" >&2; exit 1; }

          {
            echo "javas<<JAVAS"
            cut -d' ' -f1 "$RUNNER_TEMP/batches" | sort -un
            echo "JAVAS"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ steps.plan.outputs.javas }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Read build graph
        if: inputs.kind == 'graph'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          args=()
          [ -z "$VERSIONS" ] || args+=("-Pmultiloader.target.versions=$VERSIONS")
          [ -z "$LOADERS" ] || args+=("-Pmultiloader.target.loaders=$LOADERS")
          ./gradlew "${args[@]}" writeMultiloaderGraph --console=plain --max-workers=2
          test -s build/reports/multiloader/graph.json

      - name: Build release jars and manifest
        if: inputs.kind == 'release'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/manifests"
          n=0
          while read -r java versions; do
            n=$((n + 1))
            echo "::group::Minecraft $versions (Java $java)"
            home_var="JAVA_HOME_${java}_X64"
            args=("-Pmultiloader.target.versions=$versions")
            [ -z "$LOADERS" ] || args+=("-Pmultiloader.target.loaders=$LOADERS")
            JAVA_HOME="${!home_var}" ./gradlew "${args[@]}" writeReleaseManifest --console=plain --max-workers=2 < /dev/null
            cp build/release/release-manifest.json "$RUNNER_TEMP/manifests/$n.json"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/batches"

          # Batches share the repository header, so the files of every batch go into one manifest.
          jq -s '.[0] + {files: (map(.files) | add)}' "$RUNNER_TEMP"/manifests/*.json > "$RUNNER_TEMP/release-manifest.json"
          jq -e '(.files | length) > 0 and ([.files[].path] | length == (unique | length))' \
            "$RUNNER_TEMP/release-manifest.json" > /dev/null
          jq -e --arg commit "$COMMIT" '.commit == $commit' "$RUNNER_TEMP/release-manifest.json" > /dev/null

      - name: Upload build result
        shell: bash
        run: |
          set -euo pipefail
          base="$HANDOFF_URL/v1/builds/$BUILD_ID"

          # Tokens are short-lived, so each request asks for a fresh one.
          send() {
            local method="$1" url="$2" type="$3" file="$4" token status
            token=$(curl -sS --fail-with-body \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=builds.kaf.sh" | jq -r .value)
            status=$(curl -sS -o "$RUNNER_TEMP/response" -w '%{http_code}' -X "$method" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: $type" \
              -H "Content-Length: $(stat -c %s "$file")" \
              --data-binary "@$file" "$url")
            if [[ ! "$status" =~ ^2 ]]; then
              echo "$method $url failed with HTTP $status" >&2
              cat "$RUNNER_TEMP/response" >&2
              exit 1
            fi
          }

          if [ "$KIND" = graph ]; then
            send POST "$base/graph" application/json build/reports/multiloader/graph.json
            exit 0
          fi

          manifest="$RUNNER_TEMP/release-manifest.json"
          send POST "$base/manifest" application/json "$manifest"
          while read -r path; do
            encoded=$(jq -rn --arg path "$path" '$path | @uri')
            send PUT "$base/files/$encoded" application/java-archive "build/publishing/artifacts/$path"
            echo "Uploaded $path"
          done < <(jq -r '.files[].path' "$manifest")
