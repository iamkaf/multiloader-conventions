name: Plan mod builds
description: Select changed Minecraft versions and assign each check to one build job.
inputs:
  common-task:
    description: Common check to run once per version, compileJava, test, or none.
    default: compileJava
  horizontal-jars:
    description: Build all loaders together and validate the merged jar for each version.
    default: 'false'
  teakit-runner:
    description: Run existing tests with gradle or wrapper, or disable with none.
    default: none
  teakit-loaders:
    description: Comma-separated loaders to test on the latest configured version.
    default: fabric
outputs:
  matrix:
    description: Selected build jobs as a JSON array.
    value: ${{ steps.plan.outputs.matrix }}
  teakit:
    description: Selected TeaKit runtime jobs as a JSON array.
    value: ${{ steps.plan.outputs.teakit }}
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        COMMON_TASK: ${{ inputs.common-task }}
        HORIZONTAL_JARS: ${{ inputs.horizontal-jars }}
        TEAKIT_RUNNER: ${{ inputs.teakit-runner }}
        TEAKIT_LOADERS: ${{ inputs.teakit-loaders }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE_SHA: ${{ github.event.before }}
      run: python3 "$GITHUB_ACTION_PATH/plan.py"
