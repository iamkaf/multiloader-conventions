[versions]
# Core Versions
minecraft = "26.1-snapshot-5"
java = "21"
neoform = "26.1-snapshot-5-1"

# Parchment
parchment-minecraft = "1.21.11"
parchment = "2025.12.20"

# Fabric
fabric-loader = "0.19.3"
fabric-api = "0.143.1+26.1"
modmenu = "18.0.0-alpha.5"
c2me-fabric = "0.3.7+alpha.0.38+26.1-snapshot-5"

# NeoForge
neoforge = "26.1.0.0-alpha.8+snapshot-4"
c2me-neoforge = "null"

# Forge
forge = "61.0.8"

# Libraries
mixin = "0.8.5"
mixinextras = "0.4.1"
gson = "2.10.1"

# JEI
jei = "null"
jei-api = "null"

# Gradle Plugins
fabric-loom-plugin = "1.15-SNAPSHOT"
neoforge-moddev-plugin = "2.0.140"
modpublisher-plugin = "2.1.6"
forgegradle-plugin = "[7.0,8.0)"
mixin-plugin = "0.7-SNAPSHOT"

[libraries]
# Core Dependencies
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Mixin
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixin-extras = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinextras" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu" }
c2me-fabric = { group = "maven.modrinth", name = "VSNURh3q", version.ref = "c2me-fabric" }

# NeoForge
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
c2me-neoforge = { group = "maven.modrinth", name = "COlSi5iR", version.ref = "c2me-neoforge" }

# Forge
forge = { group = "net.minecraftforge", name = "forge", version.ref = "forge" }

# Parchment
parchment = { group = "org.parchmentmc.data", name = "parchment-1.21.11", version.ref = "parchment" }

# JEI
jei = { group = "maven.modrinth", name = "jei", version.ref = "jei" }
jei-blamejared = { group = "mezz.jei", name = "jei-26.1-snapshot-5", version.ref = "jei-api" }
jei-common-api = { group = "mezz.jei", name = "jei-26.1-snapshot-5-common-api", version.ref = "jei-api" }
jei-common = { group = "mezz.jei", name = "jei-26.1-snapshot-5-common", version.ref = "jei-api" }
jei-fabric-api = { group = "mezz.jei", name = "jei-26.1-snapshot-5-fabric-api", version.ref = "jei-api" }
jei-fabric = { group = "mezz.jei", name = "jei-26.1-snapshot-5-fabric", version.ref = "jei-api" }
jei-forge-api = { group = "mezz.jei", name = "jei-26.1-snapshot-5-forge-api", version.ref = "jei-api" }
jei-forge = { group = "mezz.jei", name = "jei-26.1-snapshot-5-forge", version.ref = "jei-api" }
jei-neoforge-api = { group = "mezz.jei", name = "jei-26.1-snapshot-5-neoforge-api", version.ref = "jei-api" }
jei-neoforge = { group = "mezz.jei", name = "jei-26.1-snapshot-5-neoforge", version.ref = "jei-api" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom-plugin" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev-plugin" }
modpublisher = { id = "com.hypherionmc.modutils.modpublisher", version.ref = "modpublisher-plugin" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle-plugin" }
mixin = { id = "org.spongepowered.mixin", version.ref = "mixin-plugin" }
