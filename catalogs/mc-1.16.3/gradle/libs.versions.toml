[versions]
# Core Versions
minecraft = "1.16.3"
java = "8"

# Parchment
parchment-minecraft = "1.16.3"
parchment = "null"

# Fabric
fabric-loader = "0.13.3"
fabric-api = "0.30.0+1.16"
fabric-data-generation-api = "1.1.2+4a20890318"
modmenu = "1.15.0"

# Forge
forge = "1.16.3-34.0.0"

# Libraries
mixin = "0.8.5"
mixinextras = "0.4.1"
gson = "2.10.1"
forge-config-api-port = "1.0.2"

# Amber
amber = "11.0.0+1.16.3"

# Konfig
konfig = "0.3.0+1.16.3"

# TeaKit
teakit = "0.7.0+1.16.3"

# Gradle Plugins
fabric-loom-plugin = "1.8.13"
modpublisher-plugin = "2.1.6"
forgegradle-plugin = "[6.0.47,6.2)"
mixin-plugin = "0.7-SNAPSHOT"
neoforge-legacyforge-plugin = "2.0.140"

[libraries]
# Core Dependencies
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Mixin
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixin-extras = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinextras" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-data-generation-api-v1 = { group = "net.fabricmc.fabric-api", name = "fabric-data-generation-api-v1", version.ref = "fabric-data-generation-api" }
modmenu = { group = "maven.modrinth", name = "mOgUt4GM", version.ref = "modmenu" }

# Forge
forge = { group = "net.minecraftforge", name = "forge", version.ref = "forge" }

# Parchment
parchment = { group = "org.parchmentmc.data", name = "parchment-1.16.3", version.ref = "parchment" }

# Forge Config API Port
forgeconfigapiport-fabric = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-fabric", version.ref = "forge-config-api-port" }

# Amber (all platforms)
amber = { group = "com.iamkaf.amber", name = "amber-common", version.ref = "amber" }
amber-fabric = { group = "com.iamkaf.amber", name = "amber-fabric", version.ref = "amber" }
amber-forge = { group = "com.iamkaf.amber", name = "amber-forge", version.ref = "amber" }

# Konfig
konfig = { group = "com.iamkaf.konfig", name = "konfig-common", version.ref = "konfig" }
konfig-fabric = { group = "com.iamkaf.konfig", name = "konfig-fabric", version.ref = "konfig" }

# TeaKit
teakit = { group = "com.iamkaf.teakit", name = "teakit-common", version.ref = "teakit" }
teakit-fabric = { group = "com.iamkaf.teakit", name = "teakit-fabric", version.ref = "teakit" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom-plugin" }
modpublisher = { id = "com.hypherionmc.modutils.modpublisher", version.ref = "modpublisher-plugin" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle-plugin" }
mixin = { id = "org.spongepowered.mixin", version.ref = "mixin-plugin" }
legacyforge = { id = "net.neoforged.moddev.legacyforge", version.ref = "neoforge-legacyforge-plugin" }
