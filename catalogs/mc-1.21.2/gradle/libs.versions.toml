[versions]
# Core Versions
minecraft = "1.21.2"
java = "21"
neoform = "1.21.2-20241022.151510"

# Parchment
parchment-minecraft = "1.21.1"
parchment = "2024.11.17"

# Fabric
fabric-loader = "0.19.3"
fabric-api = "0.106.1+1.21.2"
modmenu = "12.0.0"
c2me-fabric = "null"

# NeoForge
neoforge = "21.2.1-beta"
