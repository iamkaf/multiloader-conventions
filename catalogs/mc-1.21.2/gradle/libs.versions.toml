# Forge
forge = "null"

# Libraries
forge-config-api-port = "21.3.5"
mixin = "0.8.5"
mixinextras = "0.4.1"
gson = "2.10.1"

# Amber
amber = "11.1.2+1.21.2"

# Konfig
konfig = "0.5.0+1.21.2"

# TeaKit
teakit = "0.14.0+1.21.2"

# JEI
jei = "null"
