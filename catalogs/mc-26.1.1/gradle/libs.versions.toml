[versions]
# Core Versions
minecraft = "26.1.1"
java = "25"
neoform = "26.1.1-1"

# Parchment
parchment-minecraft = "1.21.11"
parchment = "2025.12.20"

# Fabric
fabric-loader = "0.18.4"
fabric-api = "0.145.4+26.1.1"
modmenu = "18.0.0-alpha.7"

# NeoForge
neoforge = "26.1.1.10-beta"

# Forge
forge = "26.1.1-63.0.1"

# Libraries
mixin = "0.8.5"
mixinextras = "0.4.1"
gson = "2.10.1"
forge-config-api-port-fabric = "26.1.0.1"
forge-config-api-port-forge = "26.1.0.2"

# Amber
amber = "11.0.0+26.1.1"

# Konfig
konfig = "0.3.0+26.1.1"

# TeaKit
teakit = "0.9.0+26.1.1"

# JEI
jei = "29.6.2.31"
jei-api = "29.4.0.23"

# Gradle Plugins
fabric-loom-plugin = "1.15-SNAPSHOT"
neoforge-moddev-plugin = "2.0.141"
modpublisher-plugin = "2.1.6"
forgegradle-plugin = "7.0.17"
mixin-plugin = "0.7-SNAPSHOT"

[libraries]
# Core Dependencies
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Mixin
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixin-extras = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinextras" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu" }

# NeoForge
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }

# Forge
forge = { group = "net.minecraftforge", name = "forge", version.ref = "forge" }

# Parchment
parchment = { group = "org.parchmentmc.data", name = "parchment-1.21.11", version.ref = "parchment" }

# Forge Config API Port
forgeconfigapiport-fabric = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-fabric", version.ref = "forge-config-api-port-fabric" }
forgeconfigapiport-common-neoforgeapi = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-common-neoforgeapi", version.ref = "forge-config-api-port-fabric" }
forgeconfigapiport-forge = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-forge", version.ref = "forge-config-api-port-forge" }

# Amber
amber = { group = "com.iamkaf.amber", name = "amber-common", version.ref = "amber" }
amber-fabric = { group = "com.iamkaf.amber", name = "amber-fabric", version.ref = "amber" }
amber-neoforge = { group = "com.iamkaf.amber", name = "amber-neoforge", version.ref = "amber" }
amber-forge = { group = "com.iamkaf.amber", name = "amber-forge", version.ref = "amber" }

# Konfig
konfig = { group = "com.iamkaf.konfig", name = "konfig-common", version.ref = "konfig" }
konfig-fabric = { group = "com.iamkaf.konfig", name = "konfig-fabric", version.ref = "konfig" }
konfig-neoforge = { group = "com.iamkaf.konfig", name = "konfig-neoforge", version.ref = "konfig" }
konfig-forge = { group = "com.iamkaf.konfig", name = "konfig-forge", version.ref = "konfig" }

# TeaKit
teakit = { group = "com.iamkaf.teakit", name = "teakit-common", version.ref = "teakit" }
teakit-fabric = { group = "com.iamkaf.teakit", name = "teakit-fabric", version.ref = "teakit" }
teakit-neoforge = { group = "com.iamkaf.teakit", name = "teakit-neoforge", version.ref = "teakit" }
teakit-forge = { group = "com.iamkaf.teakit", name = "teakit-forge", version.ref = "teakit" }
# JEI
jei = { group = "maven.modrinth", name = "jei", version.ref = "jei" }
jei-blamejared = { group = "mezz.jei", name = "jei-26.1.1", version.ref = "jei-api" }
jei-common-api = { group = "mezz.jei", name = "jei-26.1.1-common-api", version.ref = "jei-api" }
jei-common = { group = "mezz.jei", name = "jei-26.1.1-common", version.ref = "jei-api" }
jei-fabric-api = { group = "mezz.jei", name = "jei-26.1.1-fabric-api", version.ref = "jei-api" }
jei-fabric = { group = "mezz.jei", name = "jei-26.1.1-fabric", version.ref = "jei-api" }
jei-forge-api = { group = "mezz.jei", name = "jei-26.1.1-forge-api", version.ref = "jei-api" }
jei-forge = { group = "mezz.jei", name = "jei-26.1.1-forge", version.ref = "jei-api" }
jei-neoforge-api = { group = "mezz.jei", name = "jei-26.1.1-neoforge-api", version.ref = "jei-api" }
jei-neoforge = { group = "mezz.jei", name = "jei-26.1.1-neoforge", version.ref = "jei-api" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom-plugin" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev-plugin" }
modpublisher = { id = "com.hypherionmc.modutils.modpublisher", version.ref = "modpublisher-plugin" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle-plugin" }
mixin = { id = "org.spongepowered.mixin", version.ref = "mixin-plugin" }
