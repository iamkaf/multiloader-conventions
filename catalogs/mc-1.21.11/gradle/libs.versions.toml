[versions]
# Core Versions
minecraft = "1.21.11"
java = "21"
neoform = "1.21.11-20251209.172050"

# Parchment
parchment-minecraft = "1.21.11"
parchment = "2025.12.20"

# Fabric
fabric-loader = "0.19.3"
fabric-api = "0.141.3+1.21.11"
modmenu = "17.0.0-beta.2"
c2me-fabric = "null"

# NeoForge
neoforge = "21.11.38-beta"
c2me-neoforge = "0.3.6+alpha.0.80+1.21.11"

# Forge
forge = "61.1.1"

# Libraries
mixin = "0.8.5"
mixinextras = "0.4.1"
gson = "2.10.1"
forge-config-api-port = "21.11.1"

# Amber
amber = "11.1.2+1.21.11"

# Konfig
konfig = "0.5.0+1.21.11"

# TeaKit
teakit = "0.13.2+1.21.11"

# JEI
jei = "27.4.0.22"
jei-api = "27.4.0.22"

# Gradle Plugins
fabric-loom-plugin = "1.15-SNAPSHOT"
neoforge-moddev-plugin = "2.0.140"
modpublisher-plugin = "2.1.6"
forgegradle-plugin = "[7.0.11,8.0)"
mixin-plugin = "0.7-SNAPSHOT"

[libraries]
# Core Dependencies
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Mixin
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixin-extras = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinextras" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
modmenu = { group = "maven.modrinth", name = "modmenu", version.ref = "modmenu" }
c2me-fabric = { group = "maven.modrinth", name = "VSNURh3q", version.ref = "c2me-fabric" }

# NeoForge
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
c2me-neoforge = { group = "maven.modrinth", name = "COlSi5iR", version.ref = "c2me-neoforge" }

# Forge
forge = { group = "net.minecraftforge", name = "forge", version.ref = "forge" }

# Parchment
parchment = { group = "org.parchmentmc.data", name = "parchment-1.21.11", version.ref = "parchment" }

# Forge Config API Port
forgeconfigapiport-fabric = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-fabric", version.ref = "forge-config-api-port" }
forgeconfigapiport-neoforge = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-neoforge", version.ref = "forge-config-api-port" }
forgeconfigapiport-common-neoforgeapi = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-common-neoforgeapi", version.ref = "forge-config-api-port" }
forgeconfigapiport-forge = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-forge", version.ref = "forge-config-api-port" }

# Amber (all platforms)
amber = { group = "com.iamkaf.amber", name = "amber-common", version.ref = "amber" }
amber-fabric = { group = "com.iamkaf.amber", name = "amber-fabric", version.ref = "amber" }
amber-neoforge = { group = "com.iamkaf.amber", name = "amber-neoforge", version.ref = "amber" }
amber-forge = { group = "com.iamkaf.amber", name = "amber-forge", version.ref = "amber" }

# Konfig
konfig = { group = "com.iamkaf.konfig", name = "konfig-common", version.ref = "konfig" }
konfig-fabric = { group = "com.iamkaf.konfig", name = "konfig-fabric", version.ref = "konfig" }
konfig-neoforge = { group = "com.iamkaf.konfig", name = "konfig-neoforge", version.ref = "konfig" }
konfig-forge = { group = "com.iamkaf.konfig", name = "konfig-forge", version.ref = "konfig" }

# TeaKit
teakit = { group = "com.iamkaf.teakit", name = "teakit-common", version.ref = "teakit" }
teakit-fabric = { group = "com.iamkaf.teakit", name = "teakit-fabric", version.ref = "teakit" }
teakit-neoforge = { group = "com.iamkaf.teakit", name = "teakit-neoforge", version.ref = "teakit" }
teakit-forge = { group = "com.iamkaf.teakit", name = "teakit-forge", version.ref = "teakit" }
# JEI
jei = { group = "maven.modrinth", name = "jei", version.ref = "jei" }
jei-blamejared = { group = "mezz.jei", name = "jei-1.21.11", version.ref = "jei-api" }
jei-common-api = { group = "mezz.jei", name = "jei-1.21.11-common-api", version.ref = "jei-api" }
jei-common = { group = "mezz.jei", name = "jei-1.21.11-common", version.ref = "jei-api" }
jei-fabric-api = { group = "mezz.jei", name = "jei-1.21.11-fabric-api", version.ref = "jei-api" }
jei-fabric = { group = "mezz.jei", name = "jei-1.21.11-fabric", version.ref = "jei-api" }
jei-forge-api = { group = "mezz.jei", name = "jei-1.21.11-forge-api", version.ref = "jei-api" }
jei-forge = { group = "mezz.jei", name = "jei-1.21.11-forge", version.ref = "jei-api" }
jei-neoforge-api = { group = "mezz.jei", name = "jei-1.21.11-neoforge-api", version.ref = "jei-api" }
jei-neoforge = { group = "mezz.jei", name = "jei-1.21.11-neoforge", version.ref = "jei-api" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom-plugin" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev-plugin" }
modpublisher = { id = "com.hypherionmc.modutils.modpublisher", version.ref = "modpublisher-plugin" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle-plugin" }
mixin = { id = "org.spongepowered.mixin", version.ref = "mixin-plugin" }
