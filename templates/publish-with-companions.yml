name: Publish Maven Artifacts

# For a repository whose Gradle build sits below the root and which also ships companion
# libraries from the root build. The companions publish first, then the mod versions.
# The run name carries the build id, so the build host finds exactly the run it dispatched.
run-name: Publish Maven artifacts ${{ inputs.build-id }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to publish. Leave blank to use the selected ref.
        required: false
        type: string
      versions:
        description: Comma-separated Minecraft versions from versions/<version>. Leave blank to publish all.
        required: false
        type: string
      loaders:
        description: Comma-separated loaders. Leave blank to publish every loader.
        required: false
        type: string
      common:
        description: Publish the Common artifact of each version.
        required: false
        type: boolean
        default: true
      build-id:
        description: Identifier the build host knows this run by. Leave blank by hand.
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  companions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Publish companion libraries
        shell: bash
        env:
          MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
        # REPLACE_WITH_COMPANION_COMMAND: the command that publishes this repository's companion
        # libraries to Kaf Maven. It reads the two credentials above from the environment.
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew REPLACE_WITH_COMPANION_TASKS --console=plain --max-workers=2

  publish:
    needs: companions
    uses: iamkaf/multiloader-conventions/.github/workflows/publish-maven.yml@REPLACE_WITH_COMMIT_SHA
    with:
      commit: ${{ inputs.commit }}
      versions: ${{ inputs.versions }}
      loaders: ${{ inputs.loaders }}
      common: ${{ inputs.common }}
      working-directory: REPLACE_WITH_GRADLE_BUILD_DIRECTORY
    secrets:
      MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
      MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
